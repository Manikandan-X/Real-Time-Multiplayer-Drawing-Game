name: drawing_game

services:
  # =========================
  # MySQL Database
  # =========================
  mysql:
    image: mysql:8.0
    container_name: drawing_game_mysql
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "3308:3306"
    volumes:
      - drawing_game_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # =========================
  # FastAPI Backend
  # =========================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: drawing_game_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "8002:8000"
    volumes:
      - ./backend:/app
    depends_on:
      mysql:
        condition: service_healthy

  # =========================
  # React + Vite Frontend
  # =========================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: drawing_game_frontend
    restart: unless-stopped
    env_file:
      - ./frontend/.env
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      VITE_API_BASE_URL: http://localhost:8002
      VITE_WS_BASE_URL: ws://localhost:8002
    depends_on:
      - backend

# =========================
# Persistent Volumes
# =========================
volumes:
  drawing_game_mysql_data:
  frontend_node_modules:
